<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Animated 2D Globe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #081a5c 0%, #04031c 65%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
}

.space {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.star {
    position: absolute;
    border-radius: 50%;
    background: #6aa8ff;
    opacity: 0.7;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; }
    to   { opacity: 1; }
}

.planet-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 420px;
    height: 420px;
    transform: translate(-50%, -50%) rotate(20deg);
}

.glow {
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(40,120,255,.42), transparent 70%);
    filter: blur(22px);
}

.planet {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #2f67a8;
    border: 6px solid #173d86;
}

.planet::before {
    display: none;
}

.planet::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset -25px -8px 0 rgba(0,0,0,0.42);
    pointer-events: none;
    z-index: 5;
}

.continents {
    position: absolute;
    top: 0;
    left: 0;
    width: 1240px;
    height: 100%;
    animation: scrollMap 60s linear infinite;
}

@keyframes scrollMap {
    from { transform: translateX(0); }
    to   { transform: translateX(-620px); }
}

.clouds {
    position: absolute;
    top: 0;
    left: 0;
    width: 840px;
    height: 100%;
    animation: scrollClouds 90s linear infinite;
}

@keyframes scrollClouds {
    from { transform: translateX(0); }
    to   { transform: translateX(-420px); }
}

.cloud { position: absolute; }
.cloud i {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    display: block;
}
.cloud i.shadow { background: #d4e3f5; }
